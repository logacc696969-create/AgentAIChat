name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup code thật (lib/ + pubspec.yaml) trước khi flutter create
        run: |
          mkdir -p /tmp/real_app_backup
          cp -r lib /tmp/real_app_backup/lib
          cp pubspec.yaml /tmp/real_app_backup/pubspec.yaml

      - name: Tự sinh thư mục android/ nếu chưa có
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.example --project-name ai_chat_app --platforms=android .
          fi

      - name: Phục hồi lại code thật (đè lên app mẫu nếu flutter create có ghi đè)
        run: |
          rm -rf lib
          cp -r /tmp/real_app_backup/lib lib
          cp /tmp/real_app_backup/pubspec.yaml pubspec.yaml

      - name: Tự thêm quyền INTERNET vào AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
