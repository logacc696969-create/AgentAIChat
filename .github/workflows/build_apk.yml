name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Project gửi cho người dùng chỉ có lib/ + pubspec.yaml (không có
      # android/), vì môi trường tạo code ban đầu không có Flutter SDK.
      # Bước này để CHÍNH GITHUB ACTIONS tự sinh thư mục android/ bằng đúng
      # phiên bản Flutter/Gradle nó vừa cài — luôn khớp version, không cần
      # người dùng tự chạy `flutter create` ở máy mình nữa.
      - name: Tự sinh thư mục android/ nếu chưa có
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.example --project-name ai_chat_app --platforms=android .
          fi

      # flutter create mặc định không bật quyền Internet — bắt buộc phải có
      # để app gọi được API model. Tự thêm nếu chưa có, không cần người
      # dùng sửa tay AndroidManifest.xml.
      - name: Tự thêm quyền INTERNET vào AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest /s//<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' "$MANIFEST" 2>/dev/null || true
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
